[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hicon-forecasting"
version = "0.1.0"
description = "Standalone hierarchical consensus learning for time series forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.2", "numpy>=1.24", "pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["hicon*"]
